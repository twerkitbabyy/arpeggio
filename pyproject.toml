[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arpeggio"
version = "0.1.0"
description = "Interactive Active Directory recon and credential console on top of netexec (nxc)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergio Munoz Dominguez" }]
keywords = ["pentest", "active-directory", "netexec", "nxc", "red-team", "recon"]
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
arpeggio = "arpeggio.cli:main"

[project.urls]
Homepage = "https://github.com/twerkitbabyy/arpeggio"

[tool.setuptools]
packages = ["arpeggio"]
